# ============================
#   tmux
# ============================
# Cheatsheet: cheatsheets/tmux.md
# Reload without closing anything: prefix + r

# The prefix stays the default (Ctrl+b), so any tmux cheatsheet online works as-is.

# ----------------------------
# Basics
# ----------------------------
set -g mouse on               # click to pick a pane, drag borders, scroll with the wheel
set -g history-limit 10000    # scrollback lines per pane
set -sg escape-time 10        # no delay after Esc (matters in nvim)
set -g focus-events on        # lets nvim know when you enter or leave a pane
set -as terminal-features ",xterm-kitty:RGB"   # 24-bit colour in kitty

# Windows and panes start at 1 (0 is far away on the keyboard)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on    # close window 2 and window 3 becomes 2

# ----------------------------
# Key bindings
# ----------------------------
# Split with symbols that look like the result, opening in the current folder
#   prefix + |  -> new pane to the right
#   prefix + -  -> new pane below
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# The defaults (% and ") also open in the current folder
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload this file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ----------------------------
# Copy mode with vim keys
# ----------------------------
# prefix + [  -> enter, v -> start selection, y -> copy and exit
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Copied text goes to the system clipboard (kitty supports it on macOS and Linux)
set -s set-clipboard on

# ----------------------------
# Status bar (at the top, so it doesn't clash with kitty's tab bar)
# Catppuccin Frappé colours, same as kitty and yazi
# ----------------------------
set -g status-position top
set -g status-style "bg=#303446,fg=#c6d0f5"
set -g status-left "#[bg=#8caaee,fg=#303446,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#a5adce]%d/%m %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#ca9ee6,fg=#303446,bold] #I:#W#{?window_zoomed_flag, (zoom),} "
set -g pane-border-style "fg=#51576d"
set -g pane-active-border-style "fg=#8caaee"
set -g message-style "bg=#303446,fg=#e5c890"
