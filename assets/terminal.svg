<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Terminal preview: kitty with tmux, neofetch and the zsh prompt">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="win"><rect x="20" y="10" width="860" height="490" rx="12"/></clipPath>
  </defs>
  <style>
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; white-space: pre; }
    .s  { font-size: 13px; }
    .tx { fill: #c6d0f5; } .sub { fill: #a5adce; } .ov { fill: #737994; }
    .bl { fill: #8caaee; } .mv { fill: #ca9ee6; } .pk { fill: #f4b8e4; } .gr { fill: #a6d189; }
    .ye { fill: #e5c890; } .pe { fill: #ef9f76; } .sk { fill: #99d1db; } .te { fill: #81c8be; }
    .dk { fill: #303446; } .b { font-weight: 700; }
  </style>

  <g filter="url(#shadow)">
    <rect x="20" y="10" width="860" height="490" rx="12" fill="#303446" fill-opacity="0.97"/>
  </g>

  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="20" y="10" width="860" height="36" fill="#292c3c"/>
    <circle cx="42" cy="28" r="6.5" fill="#e78284"/>
    <circle cx="64" cy="28" r="6.5" fill="#e5c890"/>
    <circle cx="86" cy="28" r="6.5" fill="#a6d189"/>
    <text x="450" y="33" text-anchor="middle" class="m s ov">kitty — ~/dotfiles</text>

    <!-- tmux status bar -->
    <rect x="20" y="46" width="860" height="26" fill="#303446"/>
    <rect x="20" y="46" width="96" height="26" fill="#8caaee"/>
    <text x="34" y="64" class="m s dk b">dotfiles</text>
    <text x="128" y="64" class="m s tx">1:nvim</text>
    <rect x="188" y="46" width="66" height="26" fill="#ca9ee6"/>
    <text x="196" y="64" class="m s dk b">2:zsh</text>
    <text x="268" y="64" class="m s tx">3:yazi</text>
    <text x="866" y="64" text-anchor="end" class="m s sub">21/11 09:41</text>
    <line x1="20" y1="72.5" x2="880" y2="72.5" stroke="#414559"/>

    <!-- neofetch cat -->
    <text xml:space="preserve" class="m b pk" x="72" y="144">      /\_____/\</text>
    <text xml:space="preserve" class="m b pk" x="72" y="166">     /  <tspan class="sk">o   o</tspan>  \</text>
    <text xml:space="preserve" class="m b pk" x="72" y="188">    ( ==  <tspan class="ye">^</tspan>  == )</text>
    <text xml:space="preserve" class="m b pk" x="72" y="210">     )         (</text>
    <text xml:space="preserve" class="m b mv" x="72" y="232">    (           )</text>
    <text xml:space="preserve" class="m b mv" x="72" y="254">   ( (  )   (  ) )</text>
    <text xml:space="preserve" class="m b mv" x="72" y="276">  (__(__)___(__)__)<tspan class="gr">~~</tspan></text>

    <!-- neofetch info -->
    <text xml:space="preserve" class="m" x="360" y="112"><tspan class="pk b">you</tspan><tspan class="tx">@</tspan><tspan class="bl b">laptop</tspan></text>
    <text xml:space="preserve" class="m" x="360" y="134"><tspan class="te">─────────────────────────────</tspan></text>
    <text xml:space="preserve" class="m" x="360" y="156"><tspan class="pk">• OS      </tspan><tspan class="tx">macOS · Linux</tspan></text>
    <text xml:space="preserve" class="m" x="360" y="178"><tspan class="sk">• Shell   </tspan><tspan class="tx">zsh + powerlevel10k</tspan></text>
    <text xml:space="preserve" class="m" x="360" y="200"><tspan class="ye">• Term    </tspan><tspan class="tx">kitty</tspan></text>
    <text xml:space="preserve" class="m" x="360" y="222"><tspan class="mv">• Mux     </tspan><tspan class="tx">tmux</tspan></text>
    <text xml:space="preserve" class="m" x="360" y="244"><tspan class="gr">• Files   </tspan><tspan class="tx">yazi</tspan></text>
    <text xml:space="preserve" class="m" x="360" y="266"><tspan class="pk">• Editor  </tspan><tspan class="tx">neovim</tspan></text>
    <text xml:space="preserve" class="m" x="360" y="288"><tspan class="sk">• Theme   </tspan><tspan class="tx">Catppuccin Frappé</tspan></text>
    <text xml:space="preserve" class="m" x="360" y="310"><tspan class="te">─────────────────────────────</tspan></text>
    <g transform="translate(360 330)">
      <rect x="0"   width="28" height="14" rx="3" fill="#e78284"/>
      <rect x="34"  width="28" height="14" rx="3" fill="#ef9f76"/>
      <rect x="68"  width="28" height="14" rx="3" fill="#e5c890"/>
      <rect x="102" width="28" height="14" rx="3" fill="#a6d189"/>
      <rect x="136" width="28" height="14" rx="3" fill="#81c8be"/>
      <rect x="170" width="28" height="14" rx="3" fill="#8caaee"/>
      <rect x="204" width="28" height="14" rx="3" fill="#ca9ee6"/>
      <rect x="238" width="28" height="14" rx="3" fill="#f4b8e4"/>
    </g>

    <!-- prompt -->
    <text xml:space="preserve" class="m" x="56" y="418"><tspan class="bl b">~/dotfiles</tspan><tspan class="ov"> on </tspan><tspan class="gr">main ✔</tspan></text>
    <text class="m ov" x="844" y="418" text-anchor="end">took 2s</text>
    <text xml:space="preserve" class="m" x="56" y="444"><tspan class="gr b">❯</tspan><tspan class="gr"> z</tspan><tspan class="tx"> dot</tspan><tspan class="ov">files/cheatsheets</tspan><tspan class="tx">▌<animate attributeName="fill-opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    <text xml:space="preserve" class="m s ov" x="56" y="476">→ accept suggestion   ·   Ctrl+R history   ·   y open yazi   ·   cheat for help</text>
  </g>

  <rect x="20.5" y="10.5" width="859" height="489" rx="12" fill="none" stroke="#51576d"/>
</svg>
