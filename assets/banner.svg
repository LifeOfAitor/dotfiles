<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="~/.dotfiles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303446"/>
      <stop offset="1" stop-color="#232634"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8caaee"/>
      <stop offset="0.5" stop-color="#ca9ee6"/>
      <stop offset="1" stop-color="#f4b8e4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ca9ee6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ca9ee6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="240" rx="18" fill="url(#bg)"/>
  <rect width="900" height="240" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="18" fill="none" stroke="#414559"/>

  <!-- stars -->
  <g fill="#babbf1">
    <circle cx="70" cy="40" r="1.4" opacity="0.7"/>
    <circle cx="140" cy="190" r="1" opacity="0.5"/>
    <circle cx="790" cy="50" r="1.6" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="170" r="1.1" opacity="0.6"/>
    <circle cx="720" cy="205" r="1" opacity="0.4"/>
    <circle cx="210" cy="60" r="1.2" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title -->
  <text x="450" y="122" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="68" font-weight="700" fill="url(#title)">~/.dotfiles<tspan fill="#f4b8e4">_<animate attributeName="fill" values="#f4b8e4;#f4b8e400;#f4b8e4" keyTimes="0;0.5;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <text x="450" y="162" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" fill="#a5adce" letter-spacing="1.5">a cozy terminal for macOS &amp; Linux · one command to install</text>

  <!-- palette -->
  <g transform="translate(450 200)">
    <circle cx="-105" r="7" fill="#e78284"/>
    <circle cx="-75" r="7" fill="#ef9f76"/>
    <circle cx="-45" r="7" fill="#e5c890"/>
    <circle cx="-15" r="7" fill="#a6d189"/>
    <circle cx="15" r="7" fill="#81c8be"/>
    <circle cx="45" r="7" fill="#8caaee"/>
    <circle cx="75" r="7" fill="#ca9ee6"/>
    <circle cx="105" r="7" fill="#f4b8e4"/>
  </g>
</svg>
